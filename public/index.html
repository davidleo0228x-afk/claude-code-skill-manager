<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Manager</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="1254x1254" href="/icon.png">
<!-- Inter Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- GSAP + ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14/dist/ScrollTrigger.min.js"></script>
<style>
/* ─── Reset & Base ───────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Dark OLED palette — refined for developer tools */
  --bg: #090c14;
  --bg-alt: #0d1020;
  --surface: #11162a;
  --surface2: #181e38;
  --surface3: #1f2645;
  --border: rgba(255,255,255,.07);
  --border-hover: rgba(255,255,255,.12);
  --text: #f0f2f8;
  --text2: #a0a9c0;
  --text3: #5e6788;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,.15);
  --accent2: #818cf8;
  --green: #22c55e;
  --green-glow: rgba(34,197,94,.15);
  --orange: #f59e0b;
  --red: #ef4444;
  --pink: #ec4899;
  --cyan: #06b6d4;
  --yellow: #eab308;
  --radius: 14px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 20px rgba(0,0,0,.35);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
  --transition: 200ms cubic-bezier(.4,0,.2,1);
}
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
}

/* ─── Scrollbar (dark theme) ─────────────────────────── */
html {
  scrollbar-color: var(--surface3) transparent;
  scrollbar-width: thin;
}
html::-webkit-scrollbar { width: 6px; }
html::-webkit-scrollbar-track { background: transparent; }
html::-webkit-scrollbar-thumb {
  background: var(--surface3);
  border-radius: 3px;
}
html::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ─── Sync Progress Bar ─────────────────────────────── */
.sync-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 1001;
  pointer-events: none; opacity: 0; transition: opacity 200ms;
  background: rgba(255,255,255,.04);
}
.sync-bar.active { opacity: 1; }
.sync-bar-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--green), var(--cyan));
  border-radius: 0 2px 2px 0;
}
.sync-bar.active .sync-bar-fill {
  /* Anticipation: slow start, fast middle, slow end for organic feel */
  animation: syncBounce 1.4s cubic-bezier(.45,0,.25,1) infinite;
}
@keyframes syncBounce {
  0%   { width: 0; margin-left: 0; }
  35%  { width: 55%; margin-left: 0; }
  65%  { width: 82%; margin-left: 8%; }
  90%  { width: 94%; margin-left: 4%; }
  100% { width: 0; margin-left: 100%; }
}

/* ─── Scroll Progress Bar ────────────────────────────── */
.scroll-progress {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 1000;
  background: linear-gradient(90deg, var(--accent), var(--green));
  transform-origin: left;
  transform: scaleX(0);
  pointer-events: none;
}

/* ─── Shimmer ────────────────────────────────────────── */
.skill-grid.refreshing .card {
  pointer-events: none;
}
.skill-grid.refreshing .card::after {
  content: '';
  position: absolute; inset: 0; z-index: 10;
  background: linear-gradient(105deg,
    transparent 35%,
    rgba(59,130,246,.03) 45%,
    rgba(59,130,246,.06) 50%,
    rgba(59,130,246,.03) 55%,
    transparent 65%
  );
  background-size: 200% 100%;
  /* Slow In / Slow Out for wave-like feel */
  animation: shimmer 1.8s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ─── Card entrance (GSAP ScrollTrigger) ─────────────── */
.card {
  opacity: 0;
  transform: translateY(20px);
}

/* ─── Header ─────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(9,12,20,.85);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
  transition: box-shadow 300ms ease, background 300ms ease;
}
header.scrolled {
  box-shadow: 0 1px 0 rgba(255,255,255,.04), 0 4px 24px rgba(0,0,0,.4);
  background: rgba(9,12,20,.92);
}
header h1 {
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.03em;
  white-space: nowrap;
  background: linear-gradient(135deg, #e0e7ff, #93b4f5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-right { display: flex; align-items: center; gap: 12px; flex: 1; }

/* ─── Search ──────────────────────────────────────────── */
.search-wrap {
  position: relative; flex: 1; max-width: 400px;
}
.search-wrap input {
  width: 100%; padding: 9px 16px 9px 40px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text); font-size: 13.5px;
  font-family: inherit; font-weight: 500;
  outline: none; transition: var(--transition);
}
.search-wrap input:focus {
  border-color: rgba(255,255,255,.15);
  background: var(--surface2);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-wrap input::placeholder { color: var(--text3); font-weight: 400; }
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text3); pointer-events: none; font-size: 15px;
}

/* ─── Stats Bar ───────────────────────────────────────── */
.stats-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.stat-chip {
  font-size: 12px; font-weight: 500;
  padding: 5px 14px; border-radius: 8px;
  background: var(--surface); color: var(--text2);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 200ms cubic-bezier(.4,0,.2,1);
  white-space: nowrap;
  user-select: none;
  letter-spacing: -0.01em;
}
.stat-chip:hover {
  border-color: var(--border-hover);
  color: var(--text);
  background: var(--surface2);
  transform: scale(1.03);
}
.stat-chip:active { transform: scale(.96); transition: transform 80ms cubic-bezier(.4,0,.2,1); }
.stat-chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  transform: scale(1.03);
}

/* ─── Main ────────────────────────────────────────────── */
main { padding: 24px 32px 64px; }
.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}

/* ─── Card ────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  cursor: pointer;
  /* Slow In / Slow Out: material-standard easing for natural feel */
  transition: border-color 250ms cubic-bezier(.4,0,.2,1),
              transform 250ms cubic-bezier(.4,0,.2,1),
              box-shadow 250ms cubic-bezier(.4,0,.2,1),
              background 250ms cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}
/* Secondary Action: ambient glow follows cursor */
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(700px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(59,130,246,.08), transparent 40%);
  opacity: 0; transition: opacity 350ms cubic-bezier(.4,0,.2,1);
  pointer-events: none;
}
/* Secondary Action: subtle border glow on hover */
.card::after {
  content: '';
  position: absolute; inset: -1px; border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(59,130,246,.15), transparent 50%, rgba(129,140,248,.1));
  opacity: 0; transition: opacity 350ms cubic-bezier(.4,0,.2,1);
  pointer-events: none; z-index: 0;
}
.card:hover::before { opacity: 1; }
.card:hover::after { opacity: 1; }
.card:hover {
  border-color: rgba(255,255,255,.12);
  background: var(--surface2);
  /* Anticipation + Exaggeration: lift with subtle scale-up */
  transform: translateY(-2px) scale(1.01);
  /* Secondary Action: shadow deepens and spreads */
  box-shadow:
    0 8px 32px rgba(0,0,0,.35),
    0 0 0 1px rgba(255,255,255,.04),
    0 0 20px rgba(59,130,246,.06);
}
/* Squash & Stretch: compress on press */
.card:active {
  transform: scale(.97, .98);
  transition: transform 100ms cubic-bezier(.4,0,.2,1);
}

/* ─── Card click ripple ──────────────────────────────── */
.ripple {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,.3), rgba(59,130,246,.05));
  transform: scale(0);
  /* Follow Through: elastic easing for organic expansion */
  animation: rippleAnim .6s cubic-bezier(0, .55, .45, 1) forwards;
  pointer-events: none; z-index: 5;
}
@keyframes rippleAnim {
  0%   { transform: scale(0); opacity: 1; }
  100% { transform: scale(3.5); opacity: 0; }
}
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.card-name {
  font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  color: var(--text); line-height: 1.3;
}
.card-emoji { font-size: 22px; flex-shrink: 0; line-height: 1; }
.card-desc {
  font-size: 13px; color: var(--text2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; margin-bottom: 14px; line-height: 1.55;
  font-weight: 400;
}
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge {
  font-size: 11px; font-weight: 500; padding: 3px 10px;
  border-radius: 6px; white-space: nowrap; letter-spacing: -0.01em;
}
.badge-cat { background: var(--accent-glow); color: var(--accent); }
.badge-type { background: var(--green-glow); color: var(--green); }
.badge-platform {
  font-size: 10px; font-weight: 600; padding: 3px 8px;
  border-radius: 6px; white-space: nowrap;
  letter-spacing: 0.02em;
}
.badge-cc { background: var(--accent-glow); color: var(--accent); }
.badge-codex { background: rgba(234,179,8,.12); color: var(--yellow); }
.badge-dual { background: var(--green-glow); color: var(--green); }
.badge-project {
  background: var(--surface2); color: var(--text3);
  border: 1px solid var(--border);
}
.card-keywords {
  display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px;
}
.card-actions {
  display: flex; gap: 8px; margin-top: 16px;
}
.btn {
  font-size: 12px; font-weight: 500; padding: 6px 14px;
  border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2);
  cursor: pointer; transition: all 200ms cubic-bezier(.4,0,.2,1);
  white-space: nowrap;
  font-family: inherit; letter-spacing: -0.01em;
}
.btn:hover {
  border-color: var(--border-hover);
  background: var(--surface2);
  color: var(--text);
  transform: translateY(-1px);
}
/* Squash & Stretch on press */
.btn:active {
  transform: scale(.94, .96);
  transition: transform 80ms cubic-bezier(.4,0,.2,1);
}
.btn-danger { color: var(--red); background: rgba(239,68,68,.06); border-color: rgba(239,68,68,.15); }
.btn-danger:hover { background: rgba(239,68,68,.12); border-color: var(--red); color: var(--red); }
.refresh-btn {
  font-size: 12px; font-weight: 500; padding: 7px 14px;
  border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
  background: var(--surface); color: var(--text2);
  cursor: pointer; transition: all 200ms cubic-bezier(.4,0,.2,1);
  white-space: nowrap; flex-shrink: 0;
  font-family: inherit; letter-spacing: -0.01em;
}
.refresh-btn:hover {
  background: var(--surface2); color: var(--text);
  border-color: var(--border-hover);
  transform: translateY(-1px);
}
.refresh-btn:active { transform: scale(.94, .96); transition: transform 80ms cubic-bezier(.4,0,.2,1); }
.refresh-btn.spinning .refresh-icon { animation: spin .8s linear infinite; display: inline-block; }
.refresh-icon { display: inline-block; margin-right: 2px; }
.translate-btn {
  font-size: 12px; font-weight: 500; padding: 7px 14px;
  border-radius: 8px; border: 1px solid rgba(34,197,94,.25);
  background: var(--green-glow); color: var(--green);
  cursor: pointer; transition: all 200ms cubic-bezier(.4,0,.2,1);
  white-space: nowrap; flex-shrink: 0;
  font-family: inherit; letter-spacing: -0.01em;
}
.translate-btn:hover {
  background: var(--green); color: #000;
  border-color: var(--green);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(34,197,94,.2);
}
.translate-btn:active { transform: scale(.94, .96); transition: transform 80ms cubic-bezier(.4,0,.2,1); }
.translate-btn.spinning .translate-icon { animation: spin .8s linear infinite; display: inline-block; }
.translate-btn.spinning { pointer-events: none; opacity: .7; }
.translate-icon { display: inline-block; margin-right: 2px; }

/* ─── Empty State ─────────────────────────────────────── */
.empty {
  text-align: center; padding: 80px 20px; color: var(--text3);
}
.empty-icon { font-size: 56px; margin-bottom: 16px; }
.empty h2 { font-size: 18px; color: var(--text2); margin-bottom: 8px; }

/* ─── Modal ───────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  /* Staging: quick fade to dim background */
  animation: fadeIn 180ms cubic-bezier(.4,0,.2,1);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  max-width: 640px; width: 100%; max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
  /* Anticipation + Spring: shrink-then-expand with overshoot */
  animation: modalEnter 400ms cubic-bezier(.34,1.56,.64,1);
  transform-origin: center center;
}
@keyframes modalEnter {
  0%   { transform: translateY(48px) scale(.92); opacity: 0; }
  60%  { transform: translateY(-4px) scale(1.01); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.modal-header {
  padding: 22px 28px 16px;
  display: flex; align-items: flex-start; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface);
  border-radius: 18px 18px 0 0;
  z-index: 1;
}
.modal-title {
  font-size: 19px; font-weight: 700; letter-spacing: -0.03em;
  display: flex; align-items: center; gap: 10px;
}
.modal-close {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text2); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 200ms cubic-bezier(.4,0,.2,1); flex-shrink: 0;
}
.modal-close:hover { background: var(--surface2); color: var(--text); border-color: var(--border-hover); }
.modal-close:active { transform: scale(.88, .9); transition: transform 80ms cubic-bezier(.4,0,.2,1); }
.modal-body { padding: 24px 28px 28px; }
.modal-section { margin-bottom: 22px; }
.modal-section:last-child { margin-bottom: 0; }
.modal-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px;
}
.modal-desc { font-size: 14px; color: var(--text2); line-height: 1.7; }
.tag-list { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 12px; padding: 5px 12px;
  border-radius: 6px;
  background: var(--surface2); color: var(--text2);
  border: 1px solid var(--border);
  font-weight: 500;
}
.tag-keyword { background: rgba(129,140,248,.1); color: var(--accent2); border-color: rgba(129,140,248,.18); }
.tag-project { background: var(--green-glow); color: var(--green); border-color: rgba(34,197,94,.18); }
.tag-usage {
  background: var(--surface); color: var(--text2);
  border: 1px solid var(--border);
  text-align: left; white-space: normal;
  display: block; padding: 10px 16px; border-radius: 8px;
  font-size: 13px; margin-bottom: 4px;
  line-height: 1.5;
}
.modal-footer {
  padding: 18px 28px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
}
.modal-footer .btn { padding: 8px 20px; font-size: 13px; border-radius: 8px; }
.modal-footer .btn-danger {
  background: rgba(239,68,68,.06);
  border-color: rgba(239,68,68,.18);
  color: var(--red);
}
.modal-footer .btn-danger:hover { background: var(--red); color: #fff; border-color: var(--red); }

/* ─── Toast ───────────────────────────────────────────── */
.toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 300;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 14px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 500;
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  /* Arc: slides in with slight upward curve for natural motion */
  animation: toastIn 400ms cubic-bezier(.34,1.56,.64,1);
  min-width: 200px; max-width: 360px;
  letter-spacing: -0.01em;
}
.toast.success { border-color: rgba(34,197,94,.2); }
.toast.error { border-color: rgba(239,68,68,.2); color: var(--red); }
@keyframes toastIn {
  0%   { transform: translateX(120px) translateY(8px); opacity: 0; }
  100% { transform: translateX(0) translateY(0); opacity: 1; }
}
@keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100px) translateY(4px); opacity: 0; } }

/* ─── Loading ─────────────────────────────────────────── */
.loading { text-align: center; padding: 80px; color: var(--text3); }
.spinner {
  width: 36px; height: 36px; margin: 0 auto 16px;
  border: 2.5px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Responsive ──────────────────────────────────────── */
@media (max-width: 768px) {
  header { flex-direction: column; align-items: flex-start; padding: 14px 18px; gap: 10px; }
  .header-right { flex-direction: column; width: 100%; gap: 8px; }
  .search-wrap { max-width: 100%; }
  .skill-grid { grid-template-columns: 1fr; }
  main { padding: 16px; }
  .stats-bar { gap: 4px; }
  .stat-chip { font-size: 11px; padding: 4px 10px; }
  .modal { margin: 12px; max-height: 90vh; }
  .modal-header, .modal-body, .modal-footer { padding-left: 18px; padding-right: 18px; }

/* ─── Hide Scrollbar ─────────────────────────────────── */
.modal::-webkit-scrollbar { display: none; }
.modal { scrollbar-width: none; -ms-overflow-style: none; }
}
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>
<div class="sync-bar" id="syncBar"><div class="sync-bar-fill"></div></div>
<header>
  <h1>🧩 Skill Manager</h1>
  <div class="header-right">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="搜索 Skill 名称、关键词、项目类型…" autocomplete="off">
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <button class="btn translate-btn" id="translateBtn" onclick="translateAll()" title="翻译所有英文描述"><span class="translate-icon">🌐</span> 翻译</button>
    <button class="btn refresh-btn" id="refreshBtn" onclick="manualRefresh()" title="同步最新 Skill"><span class="refresh-icon">🔄</span> 同步</button>
  </div>
</header>

<main>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在加载 Skills…</div>
  </div>
  <div class="skill-grid" id="grid" style="display:none"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-icon">📭</div>
    <h2>没有匹配的 Skill</h2>
    <p>试试其他搜索词或清除筛选条件</p>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// GSAP + ScrollTrigger — Init
// ═══════════════════════════════════════════════════════════════
gsap.registerPlugin(ScrollTrigger);

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

// ─── Scroll Progress Bar ─────────────────────────────────────
gsap.to('#scrollProgress', {
  scaleX: 1,
  ease: 'none',
  scrollTrigger: {
    trigger: document.body,
    start: 'top top',
    end: 'bottom bottom',
    scrub: 0.3,
  }
});

// ─── Header shadow on scroll ─────────────────────────────────
ScrollTrigger.create({
  start: 1,
  end: Infinity,
  onEnter: () => document.querySelector('header')?.classList.add('scrolled'),
  onLeaveBack:() => document.querySelector('header')?.classList.remove('scrolled'),
});

// ─── Card scroll-reveal ──────────────────────────────────────
function animateCards() {
  if (prefersReducedMotion.matches) {
    gsap.set('.card', { opacity: 1, y: 0, scale: 1 });
    return;
  }

  ScrollTrigger.batch('.card', {
    onEnter: elements => {
      // Anticipation + Slow In / Slow Out: cards rise from below with subtle scale
      gsap.fromTo(elements,
        { opacity: 0, y: 32, scale: 0.95 },
        {
          opacity: 1, y: 0, scale: 1,
          stagger: 0.05,
          duration: 0.55,
          ease: 'power3.out',
          overwrite: 'auto',
        }
      );
    },
    start: 'top 94%',
    once: true,
  });

  // Refresh so newly rendered cards are detected
  ScrollTrigger.refresh();
}

// ═══════════════════════════════════════════════════════════════
// ─── State ──────────────────────────────────────────────────
let allSkills = [];
let stats = {};
let platformStats = {};
let activeCategory = null;
let activePlatform = null;
let searchQuery = '';
let lastSkillCount = 0;
let lastUpdated = null;
let autoRefreshInterval = null;

// ─── API ────────────────────────────────────────────────────
const API = '/api/skills';
async function fetchSkills() {
  const res = await fetch(API);
  const data = await res.json();
  allSkills = data.skills;
  stats = data.stats;
  platformStats = data.platformStats || {};
  lastUpdated = new Date();
  return data;
}

async function deleteSkill(name) {
  const res = await fetch(`${API}/${encodeURIComponent(name)}`, { method: 'DELETE' });
  return res.json();
}

// ─── Render ─────────────────────────────────────────────────
function filterSkills() {
  return allSkills.filter(s => {
    if (activeCategory && s.category !== activeCategory) return false;
    if (activePlatform && s.platform !== activePlatform) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const haystack = [
        s.name, s.description, s.category,
        ...s.suitableProjects, ...s.triggerKeywords
      ].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

function renderStats() {
  const bar = document.getElementById('statsBar');
  const totalChip = `<button class="stat-chip${!activeCategory && !activePlatform ? ' active' : ''}" onclick="setCategory(null)">全部 (${allSkills.length})</button>`;
  const ccChip = `<button class="stat-chip${activePlatform === 'claude-code' ? ' active' : ''}" onclick="setPlatform('claude-code')">🧩 Claude · ${platformStats['claude-code'] || 0}</button>`;
  const codexChip = `<button class="stat-chip${activePlatform === 'codex' ? ' active' : ''}" onclick="setPlatform('codex')">🤖 Codex · ${platformStats['codex'] || 0}</button>`;
  const catChips = Object.entries(stats).map(([cat, count]) =>
    `<button class="stat-chip${activeCategory === cat ? ' active' : ''}" onclick="setCategory('${cat.replace(/'/g, "\\'")}')">${cat} · ${count}</button>`
  ).join('');
  bar.innerHTML = totalChip + ccChip + codexChip + catChips;
}

function setPlatform(platform) {
  activePlatform = platform;
  activeCategory = null;
  renderStats();
  renderCards();
}

function setCategory(cat) {
  activeCategory = cat;
  activePlatform = null;
  renderStats();
  renderCards();
}

function renderCards() {
  const filtered = filterSkills();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const loading = document.getElementById('loading');

  loading.style.display = 'none';

  if (filtered.length === 0) {
    grid.style.display = 'none';
    empty.style.display = '';
    return;
  }

  empty.style.display = 'none';
  grid.style.display = '';

  grid.innerHTML = filtered.map(s => {
    const projectTags = s.suitableProjects.slice(0, 3).map(p =>
      `<span class="badge badge-project">${p}</span>`
    ).join('');
    return `
    <div class="card" onclick="openDetail('${s.dirName.replace(/'/g, "\\'")}')" data-skill="${s.dirName}">
      <div class="card-top">
        <span class="card-name">${s.emoji} ${s.name}</span>
      </div>
      <div class="card-desc">${escHtml(s.description).slice(0, 120)}</div>
      <div class="card-meta">
        <span class="badge badge-platform ${s.platform === 'codex' ? 'badge-codex' : 'badge-cc'}">${s.platform === 'codex' ? '🤖 Codex' : '🧩 Claude'}</span>
        <span class="badge badge-cat">${s.category}</span>
        ${projectTags}
      </div>
      <div class="card-keywords">
        ${s.triggerKeywords.slice(0, 5).map(k => `<span class="tag tag-keyword">${k}</span>`).join('')}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn" onclick="openDetail('${s.dirName.replace(/'/g, "\\'")}')">📋 详情</button>
        <button class="btn btn-danger" onclick="confirmDelete('${s.dirName.replace(/'/g, "\\'")}', '${s.name.replace(/'/g, "\\'")}')">🗑 删除</button>
      </div>
    </div>`;
  }).join('');

  // Trigger GSAP scroll-reveal for newly rendered cards
  requestAnimationFrame(() => animateCards());
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ─── Detail Modal ───────────────────────────────────────────
function openDetail(dirName) {
  const s = allSkills.find(sk => sk.dirName === dirName);
  if (!s) return;

  const html = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${s.emoji} ${escHtml(s.name)}</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-section">
          <div class="modal-label">📝 简介</div>
          <div class="modal-desc">${escHtml(s.description)}</div>
          ${s.descriptionEn && s.descriptionEn !== s.description ? `<div class="modal-desc" style="margin-top:8px;font-size:12px;color:var(--text3);border-left:2px solid var(--border);padding-left:12px;">${escHtml(s.descriptionEn)}</div>` : ''}
        </div>
        <div class="modal-section">
          <div class="modal-label">📂 分类 / 平台</div>
          <div class="tag-list">
            <span class="badge badge-platform ${s.platform === 'codex' ? 'badge-codex' : 'badge-cc'}" style="font-size:13px;padding:6px 14px;">${s.platform === 'codex' ? '🤖 Codex' : '🧩 Claude Code'}${s.compatibility === 'dual' ? ' (兼容双平台)' : ''}</span>
            <span class="badge badge-cat" style="font-size:13px;padding:6px 14px;">${s.category}</span>
          </div>
        </div>
        ${s.suitableProjects.length ? `
        <div class="modal-section">
          <div class="modal-label">🎯 适合的项目</div>
          <div class="tag-list">
            ${s.suitableProjects.map(p => `<span class="tag tag-project">${p}</span>`).join('')}
          </div>
        </div>` : ''}
        ${s.triggerKeywords.length ? `
        <div class="modal-section">
          <div class="modal-label">💬 触发关键词</div>
          <div class="tag-list">
            ${s.triggerKeywords.map(k => `<span class="tag tag-keyword">${k}</span>`).join('')}
          </div>
        </div>` : ''}
        ${s.usageItems.length ? `
        <div class="modal-section">
          <div class="modal-label">📋 使用场景</div>
          ${s.usageItems.map(u => `<div class="tag tag-usage">▸ ${u}</div>`).join('')}
        </div>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">关闭</button>
        <button class="btn btn-danger" onclick="confirmDelete('${s.dirName.replace(/'/g, "\\'")}', '${s.name.replace(/'/g, "\\'")}'); closeModal();">🗑 删除此 Skill</button>
      </div>
    </div>
  </div>`;

  document.body.style.overflow = 'hidden';
  document.getElementById('modalContainer').innerHTML = html;
  // Clean up GPU layer after animation
  const modal = document.querySelector('.modal');
  if (modal) {
    modal.addEventListener('animationend', () => { modal.style.willChange = 'auto'; }, { once: true });
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.addEventListener('animationend', () => { overlay.style.willChange = 'auto'; }, { once: true });
  }
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
  document.body.style.overflow = '';
}

// ─── Delete ─────────────────────────────────────────────────
function confirmDelete(dirName, displayName) {
  if (!confirm(`确定要删除 "${displayName}" 吗？\n\n这将移除符号链接和所有文件。此操作不可撤销。`)) return;

  deleteSkill(dirName).then(result => {
    if (result.success) {
      allSkills = allSkills.filter(s => s.dirName !== dirName);
      stats = {};
      allSkills.forEach(s => { stats[s.category] = (stats[s.category] || 0) + 1; });
      renderStats();
      renderCards();
      showToast(`✅ 已删除 "${displayName}"`, 'success');
    } else {
      showToast(`❌ 删除失败: ${(result.errors||[]).join(', ')}`, 'error');
    }
  });
}

// ─── Toast ──────────────────────────────────────────────────
function showToast(msg, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'slideOut 250ms ease-out forwards';
    setTimeout(() => toast.remove(), 250);
  }, 3000);
}

// ─── Search ─────────────────────────────────────────────────
let searchTimeout;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchQuery = this.value.trim();
    renderCards();
  }, 150);
});

// ─── Keyboard ───────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// ─── Card hover effect ──────────────────────────────────────
document.addEventListener('mousemove', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
  card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
});

// ─── Card click ripple ──────────────────────────────────────
document.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const rect = card.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = `${size}px`;
  ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
  ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
  card.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
});

// ─── Translate All ──────────────────────────────────────────
async function translateAll() {
  const btn = document.getElementById('translateBtn');
  if (btn.classList.contains('spinning')) return;
  btn.classList.add('spinning');
  btn.disabled = true;

  showToast('🌐 正在翻译所有英文描述…', 'success');

  try {
    const res = await fetch('/api/translate-all', { method: 'POST' });
    const data = await res.json();

    if (data.success) {
      showToast(`✅ ${data.message}`, 'success');
      // Refresh skill list to show new translations
      if (data.translated > 0) {
        await fetchSkills();
        renderStats();
        renderCards();
      }
    } else {
      showToast('❌ 翻译失败，请稍后重试', 'error');
    }
  } catch (err) {
    showToast(`❌ 翻译请求失败: ${err.message}`, 'error');
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
}

// ─── Refresh ────────────────────────────────────────────────
function startSyncAnim() {
  document.getElementById('syncBar').classList.add('active');
  document.getElementById('grid').classList.add('refreshing');
}

function stopSyncAnim() {
  document.getElementById('syncBar').classList.remove('active');
  document.getElementById('grid').classList.remove('refreshing');
  // Re-run GSAP scroll-reveal for refreshed cards
  animateCards();
}

async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  startSyncAnim();

  const prevNames = new Set(allSkills.map(s => s.dirName));
  try {
    // Small delay so the animation is visible even on fast responses
    const [data] = await Promise.all([
      fetchSkills(),
      new Promise(r => setTimeout(r, 400))
    ]);

    const newNames = new Set(allSkills.map(s => s.dirName));
    const added = allSkills.filter(s => !prevNames.has(s.dirName));
    const removed = [...prevNames].filter(n => !newNames.has(n));

    if (added.length || removed.length) {
      let msg = [];
      if (added.length) msg.push(`🎉 新增 ${added.length} 个: ${added.map(s => s.name).join(', ')}`);
      if (removed.length) msg.push(`🗑 移除 ${removed.length} 个: ${removed.join(', ')}`);
      showToast(msg.join('  |  '), 'success');
    }

    lastSkillCount = allSkills.length;
    renderStats();
    renderCards();
  } catch (err) {
    showToast(`❌ 同步失败: ${err.message}`, 'error');
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
    stopSyncAnim();
  }
}

function startAutoRefresh() {
  // Poll every 30 seconds for new skills
  autoRefreshInterval = setInterval(async () => {
    try {
      const res = await fetch(API);
      const data = await res.json();
      const currentNames = new Set(allSkills.map(s => s.dirName));
      const newSkills = data.skills.filter(s => !currentNames.has(s.dirName));
      const removed = [...currentNames].filter(n => !data.skills.find(s => s.dirName === n));

      if (newSkills.length || removed.length) {
        allSkills = data.skills;
        stats = data.stats;
        platformStats = data.platformStats || {};
        lastUpdated = new Date();
        let msg = [];
        if (newSkills.length) msg.push(`🎉 检测到新 Skill: ${newSkills.map(s => s.name).join(', ')}`);
        if (removed.length) msg.push(`🗑 已移除: ${removed.join(', ')}`);
        showToast(msg.join('  |  '), 'success');
        lastSkillCount = allSkills.length;
        renderStats();
        renderCards();
      }
    } catch {} // silent fail for auto-poll
  }, 30000);
}

// ─── Init ───────────────────────────────────────────────────
fetchSkills().then(() => {
  lastSkillCount = allSkills.length;
  renderStats();
  renderCards();
  // GSAP scroll-reveal for initial cards
  requestAnimationFrame(() => animateCards());
  startAutoRefresh();
}).catch(err => {
  document.getElementById('loading').innerHTML =
    `<div style="color:var(--red)">❌ 加载失败: ${escHtml(err.message)}</div>`;
});
</script>
